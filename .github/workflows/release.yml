name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  # v0.1.1 shipped assets named 0.1.0 because the tag was bumped and
  # project(VERSION) was not. Catch that before anything is built.
  check-version:
    name: Tag matches project version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(sed -n 's/^project(SonyDeviceCenter VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=$tag project=$proj"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match project(VERSION $proj) in CMakeLists.txt"
            exit 1
          fi
      - name: Verify committed release source
        shell: bash
        run: |
          args=()
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then args+=(--allow-untagged); fi
          python packaging/verify-release-source.py "${args[@]}"

  linux:
    name: Linux packages (DEB, RPM, TGZ)
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake rpm \
            libbluetooth-dev libdbus-1-dev \
            libglew-dev libglfw3-dev libgl1-mesa-dev \
            qt6-base-dev qt6-declarative-dev
      - name: Record source provenance
        run: |
          mkdir -p build
          args=()
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then args+=(--allow-untagged); fi
          python packaging/verify-release-source.py "${args[@]}" --output build/SOURCE-linux.json

      # Packaging builds do not run the suite, so tests are left out of the
      # configure entirely rather than built and skipped.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DBUILD_TESTING=OFF -DSONY_REQUIRE_QT=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: cd build && cpack -G "DEB;RPM;TGZ"

      - name: Collect
        run: |
          mkdir -p dist
          cp build/*.deb build/*.rpm build/*.tar.gz build/SOURCE-linux.json dist/
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-packages
          path: dist/

  windows:
    name: Windows installer (NSIS, ZIP)
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      # qtdeclarative ships inside the Qt 6 desktop base archive; naming it as
      # an optional module makes aqtinstall fail with "not available".
      # v0.1.1 and v0.1.2 shipped Qt 6.8.3, affected by CVE-2025-12385 and
      # CVE-2025-10729. Those are fixed in 6.8.5/6.8.6 — but 6.8 is an LTS and
      # the open-source mirror stops at 6.8.3, so the fixes are unreachable on
      # that line. Hence 6.10.x, which is current and post-dates them.
      # `aqt list-qt windows desktop` is the way to check what is actually
      # published before changing this.
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.10.*'
          arch: 'win64_msvc2022_64'

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }

      - name: Record source provenance
        shell: bash
        run: |
          mkdir -p build
          args=()
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then args+=(--allow-untagged); fi
          python packaging/verify-release-source.py "${args[@]}" --output build/SOURCE-windows.json

      - name: Configure
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DBUILD_TESTING=OFF \
                -DSONY_REQUIRE_QT=ON -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"

      - name: Build
        shell: bash
        run: cmake --build build --config ${BUILD_TYPE} --parallel

      - name: Import Windows signing certificate
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SONY_WINDOWS_CERTIFICATE_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SONY_WINDOWS_CERTIFICATE_PASSWORD }}
          SONY_WINDOWS_TIMESTAMP_SERVER: ${{ vars.SONY_WINDOWS_TIMESTAMP_SERVER }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SONY_WINDOWS_TIMESTAMP_SERVER) {
            throw 'Production Windows releases require a signing certificate and timestamp endpoint.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'sony-windows-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $signingCertificates = @($certificates | Where-Object HasPrivateKey)
            if ($signingCertificates.Count -ne 1) { throw 'Expected one signing certificate with a private key' }
            "SONY_WINDOWS_SIGNING_THUMBPRINT=$($signingCertificates[0].Thumbprint)" >> $env:GITHUB_ENV
            "SONY_WINDOWS_TIMESTAMP_SERVER=$env:SONY_WINDOWS_TIMESTAMP_SERVER" >> $env:GITHUB_ENV
          } finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }

      - name: Package
        shell: pwsh
        run: |
          $options = @{}
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $options.Development = $true }
          ./packaging/windows/build-qt-installer.ps1 -BuildDir build `
            -MakeNsis "${env:ProgramFiles(x86)}\NSIS\makensis.exe" @options
          cpack --config build/CPackConfig.cmake -B build -C $env:BUILD_TYPE -G ZIP
          if ($LASTEXITCODE -ne 0) { throw 'CPack ZIP failed' }

      - name: Test installer and release safety
        shell: pwsh
        run: |
          $env:SONY_TEST_INSTALLER = (Get-ChildItem build/artifacts/*.exe | Select-Object -First 1).FullName
          $env:SONY_TEST_NSIS = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          python -m unittest discover -s tests -p test_release_safety.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Installer safety tests failed' }

      - name: Remove Windows signing certificate
        if: always() && github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ($env:SONY_WINDOWS_SIGNING_THUMBPRINT -match '^[A-Fa-f0-9]{40}$') {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:SONY_WINDOWS_SIGNING_THUMBPRINT" -Force
          }

      # v0.1.0 shipped an app that could not start because the MSVC runtime
      # was missing. Assert on the produced archive so that fails the build
      # here instead of on a user's desktop.
      - name: Verify the package is self-contained
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem build/*.zip | Select-Object -First 1
          if (-not $zip) { throw 'no ZIP produced' }
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = $archive.Entries.Name
          $required = @(
            'sony-device-center.exe', 'sonyd.exe', 'sonyctl.exe',
            'Qt6Core.dll', 'Qt6Quick.dll', 'Qt6QuickControls2.dll',
            'MSVCP140.dll', 'VCRUNTIME140.dll', 'VCRUNTIME140_1.dll'
          )
          $missing = $required | Where-Object { $names -notcontains $_ }
          $archive.Dispose()
          if ($missing) { throw "missing from $($zip.Name): $($missing -join ', ')" }
          Write-Host "$($zip.Name) contains all required binaries and runtime"

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp build/artifacts/*.exe build/*.zip build/SOURCE-windows.json dist/
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-packages
          path: dist/

  macos:
    name: macOS disk image (DMG)
    needs: check-version
    runs-on: macos-latest
    env:
      # Opt in only after configuring the six secrets in packaging/README.md.
      # Once enabled, missing credentials or failed trust checks stop release.
      SONY_REQUIRE_NOTARIZATION: ${{ vars.SONY_MACOS_SIGNING_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      # Same Qt line as Windows, for the same CVE reasons. The macOS archive
      # is universal, so one DMG serves Apple silicon and Intel.
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.10.*'
          arch: 'clang_64'

      - name: Install dmgbuild
        run: pipx install dmgbuild
      - name: Record source provenance
        run: |
          mkdir -p build
          args=()
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then args+=(--allow-untagged); fi
          python packaging/verify-release-source.py "${args[@]}" --output build/SOURCE-macos.json

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DBUILD_TESTING=OFF \
                -DSONY_REQUIRE_QT=ON -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Prepare Developer ID signing and notarization
        if: env.SONY_REQUIRE_NOTARIZATION == 'true'
        env:
          SONY_MACOS_CERTIFICATE_BASE64: ${{ secrets.SONY_MACOS_CERTIFICATE_BASE64 }}
          SONY_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.SONY_MACOS_CERTIFICATE_PASSWORD }}
          SONY_CODESIGN_IDENTITY: ${{ secrets.SONY_CODESIGN_IDENTITY }}
          SONY_NOTARY_KEY_BASE64: ${{ secrets.SONY_NOTARY_KEY_BASE64 }}
          SONY_NOTARY_KEY_ID: ${{ secrets.SONY_NOTARY_KEY_ID }}
          SONY_NOTARY_ISSUER_ID: ${{ secrets.SONY_NOTARY_ISSUER_ID }}
        run: bash packaging/macos/prepare-signing.sh

      - name: Package
        run: cmake --build build --target dmg

      - name: Verify the disk image is self-contained
        run: packaging/macos/verify-dmg.sh build/*.dmg arm64 x86_64

      - name: Collect
        run: |
          mkdir -p dist
          cp build/*.dmg build/SOURCE-macos.json dist/
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-packages
          path: dist/

      - name: Remove signing credentials
        if: always() && env.SONY_REQUIRE_NOTARIZATION == 'true'
        run: |
          keychain="$RUNNER_TEMP/sony-macos-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/sony-macos-signing.p12" "$RUNNER_TEMP/sony-macos-notary.p8"

  publish:
    name: Publish GitHub release
    needs: [linux, windows, macos]
    # A manual run builds everything and stops here; only a tag publishes.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist

      - name: Generate artifact checksums
        run: |
          cd dist
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      # --generate-notes on its own produces a bare PR changelog and silently
      # ignores the annotated tag message, so the notes are assembled here:
      # a maintained header plus GitHub's generated changelog.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > generated.md
          cat .github/release-notes-header.md generated.md > notes.md
          cat notes.md

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md
